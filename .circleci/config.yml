version: 2.1

# The release, in CircleCI's own syntax.
#
# Why this exists beside `.github/workflows/release.yml`: CircleCI's GitHub
# Actions support is in Preview, and it accepted this workflow's translation and
# then compiled it to a config with no jobs — a red run with no error to act on.
# The publish path is the one place that must not be experimental, so it lives
# here in syntax CircleCI compiles itself.
#
# `.github/workflows/release.yml` stays for a hosted GitHub run, and both must
# keep agreeing: the publish order, the skip-if-already-published check, the
# dist-tag each version implies and the v* tag gate are the same decisions in
# both files. Change one and change the other.
#
# npm's trusted publishing is not available here: it needs a cloud-hosted runner
# and rejects the OIDC token CircleCI mints. This authenticates with NPM_TOKEN
# from the project environment, and publishes without provenance, which npm does
# not support for CircleCI trusted publishing either.

jobs:
  publish:
    docker:
      - image: cimg/node:24
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Install
          command: npm install --no-audit --no-fund

      - run:
          name: Build
          command: npm run build

      - run:
          name: Verify dist outputs
          command: |
            test -f packages/media/dist/index.js
            test -f packages/media/dist/index.d.ts
            test -f packages/media/dist/node.js
            test -f packages/media/dist/node.d.ts
            test -f packages/media/dist/client.js
            test -f packages/media/dist/client.d.ts
            test -f packages/sdk/dist/index.js
            test -f packages/sdk/dist/index.d.ts
            test -f packages/agents/dist/index.js
            test -f packages/agents/dist/index.d.ts
            test -f packages/rig/dist/index.js
            test -f packages/rig/dist/index.d.ts
            test -f packages/binding/dist/index.js
            test -f packages/binding/dist/index.d.ts
            test -f packages/binding/dist/node.js
            test -f packages/binding/dist/web.js
            test -f packages/relay/dist/index.js
            test -f packages/relay/dist/index.d.ts
            test -f packages/dev-tools/dist/index.js
            test -f packages/dev-tools/dist/index.d.ts
            test -f packages/ui/dist/index.js
            test -f packages/ui/dist/fold.js
            test -f packages/desktop/dist/index.js
            test -f packages/desktop/dist/preload.js
            test -f packages/dev-tools/dist/react.js
            test -f packages/dev-tools/dist/react.d.ts
            test -f packages/dev-tools/dist/ink.js
            test -f packages/dev-tools/dist/ink.d.ts
            test -f packages/rig/dist/node.js
            test -f packages/rig/dist/node.d.ts
            test -f packages/host/dist/index.js
            test -f packages/host/dist/index.d.ts
            # channel-verify ships a dual build, so BOTH halves must exist —
            # `files: ["dist/"]` would happily publish a package missing one,
            # and a consumer only discovers it at import time.
            test -f packages/channel-verify/dist/cjs/index.js
            test -f packages/channel-verify/dist/cjs/index.d.ts
            test -f packages/channel-verify/dist/esm/index.js
            test -f packages/channel-verify/dist/esm/index.d.ts
            test -f packages/channel-verify/dist/cjs/package.json
            test -f packages/channel-verify/dist/esm/package.json

      - run:
          name: Typecheck
          command: |
            npx tsc -b packages/media packages/sdk packages/agents packages/rig packages/channel-verify packages/binding packages/relay packages/host packages/desktop
            # `ui` builds with `tsc -p`, which does NOT build the references it
            # declares, so it must follow the batch that produces binding's and
            # media's dist rather than join it.
            npm run build -w packages/ui

      - run:
          name: Authenticate to npm
          command: |
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "NPM_TOKEN is not set for this project, so nothing can be published." >&2
              exit 1
            fi
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
            echo "wrote ~/.npmrc from NPM_TOKEN"

      - run:
          name: Publish packages
          command: |
            set -euo pipefail

            # The trigger fires on every tag; this workflow publishes only a v*
            # one, which is the filter the GitHub workflow declares under `on:`.
            case "${CIRCLE_TAG:-}" in
              v*) ;;
              *) echo "${CIRCLE_TAG:-no tag} is not a v* tag; nothing was published."; exit 0 ;;
            esac

            # channel-verify FIRST: rig and harness-cli both depend on it, and a
            # failure partway through would otherwise leave an already-published
            # rig pointing at a version that does not exist on the registry —
            # breaking fresh installs until someone repaired the partial release.
            # It has no dependencies of its own, so it is safe at the head.
            # media sits right after channel-verify: sdk, agents and rig all
            # depend on it, so it must exist on the registry before they do.
            for pkg in packages/channel-verify packages/media packages/sdk packages/agents packages/binding packages/host packages/relay packages/rig packages/dev-tools packages/ui packages/desktop; do
              name=$(node -p "require('./$pkg/package.json').name")
              version=$(node -p "require('./$pkg/package.json').version")
              # The dist-tag follows each package's OWN version: an -alpha.N
              # version publishes under the alpha channel and can never move
              # `latest`.
              case "$version" in
                *-alpha*) tag=alpha ;;
                *-beta*)  tag=beta ;;
                *-rc*)    tag=rc ;;
                *)        tag=latest ;;
              esac
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is already published, skipping"
                continue
              fi
              echo "Publishing $name@$version (tag: $tag)..."
              npm publish --workspace "$pkg" --access public --tag "$tag"
            done

workflows:
  release:
    jobs:
      - publish:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
